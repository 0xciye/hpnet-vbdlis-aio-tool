name: Build and publish Windows update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hpnet-auto-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: docs/REQUIREMENTS_BUILD.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r docs\REQUIREMENTS_BUILD.txt

      - name: Prepare portable Node runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD 'src\nodes_tools\runtime'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Copy-Item -LiteralPath (Get-Command node.exe).Source -Destination (Join-Path $runtime 'node.exe')
          npm install --prefix $runtime --ignore-scripts --omit=optional playwright@1.62.1

      - name: Build and verify release
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $releaseId = "auto-$env:GITHUB_RUN_NUMBER-$short"
          "RELEASE_ID=$releaseId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          .\build_release.ps1 -ReleaseId $releaseId -SkipDesktopCopy

      - name: Create checksum
        shell: pwsh
        run: |
          $zip = Join-Path $PWD 'release\HPNet VBDLIS AIO Tool.zip'
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  HPNet VBDLIS AIO Tool.zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_ID `
            'release\HPNet VBDLIS AIO Tool.zip' `
            'release\HPNet VBDLIS AIO Tool.zip.sha256' `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "HPNet VBDLIS AIO Tool $env:RELEASE_ID" `
            --notes "Bản cập nhật tự động từ commit $env:GITHUB_SHA." --latest

