name: Build and publish Windows update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hpnet-auto-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: docs/REQUIREMENTS_BUILD.txt

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r docs\REQUIREMENTS_BUILD.txt

      - name: Prepare portable Node runtime
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD 'src\nodes_tools\runtime'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          Copy-Item -LiteralPath (Get-Command node.exe).Source -Destination (Join-Path $runtime 'node.exe')
          npm install --prefix '.github\runtime' --ignore-scripts --omit=optional --no-audit --no-fund
          Copy-Item -LiteralPath '.github\runtime\node_modules' -Destination $runtime -Recurse

      - name: Choose semantic version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versions = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' |
            Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |
            ForEach-Object { [version]$_.Substring(1) })
          $latest = $versions | Sort-Object -Descending | Select-Object -First 1
          # Transition the existing 1.2 line to the requested v1.3.0 release.
          $releaseId = if (-not $latest -or $latest -lt [version]'1.3.0') {
            'v1.3.0'
          } else {
            "v$($latest.Major).$($latest.Minor).$($latest.Build + 1)"
          }
          "RELEASE_ID=$releaseId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify release
        shell: pwsh
        run: |
          try {
            .\build_release.ps1 -ReleaseId $env:RELEASE_ID -SkipDesktopCopy
          } catch {
            Write-Output "::error title=Release build failed::$($_.Exception.Message)"
            throw
          }

      - name: Create checksum
        shell: pwsh
        run: |
          $zip = Join-Path $PWD 'release\HPNet VBDLIS AIO Tool.zip'
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  HPNet VBDLIS AIO Tool.zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_ID `
            'release\HPNet VBDLIS AIO Tool.zip' `
            'release\HPNet VBDLIS AIO Tool.zip.sha256' `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "HPNet VBDLIS AIO Tool $env:RELEASE_ID" `
            --generate-notes --latest

      - name: Keep only latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $oldTags = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' |
            Where-Object { $_ -ne $env:RELEASE_ID })
          foreach ($tag in $oldTags) {
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
          }
